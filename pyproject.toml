[project]
name = "devops-portfolio"
version = "1.0.0"
description = "Automated DevOps Portfolio Generator from Jira + GitHub"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31.0",
    "jinja2>=3.1.4",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
    "rich>=13.7.1",
    "anthropic>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project.scripts]
portfolio = "scripts.main:main"

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.4.0",
]